# NOTIONAL DEMO VALUES ONLY
# All parameters in this file are purely for demonstration purposes.
# They do NOT represent any real vehicle design or performance characteristics.
# 
# These notional parameters are tuned to produce ICBM-scale demonstration ranges
# (~2500-2900 km) for illustrative purposes only.

vehicle:
  name: demo-vehicle-v0
  stages:
    - name: stage_1
      mass_launch_kg: 6000
      mass_burnout_kg: 2200
      thrust_n: 180000
      isp_s: 265
      burn_time_s: 65
    - name: stage_2
      mass_launch_kg: 2200  # ignition mass, includes RV
      mass_burnout_kg: 700
      thrust_n: 65000
      isp_s: 295
      burn_time_s: 65
  stage_separation_coast_s: 3
  reentry_vehicle:
    mass_kg: 400
    separates_after: stage_2_burnout
  launch:
    angle_range_deg: [20, 85]
    azimuth_handled_by: landing_point_bearing

aerodynamics:
  reference_area_m2: 0.3
  cd_vs_mach:
    - [0.0, 0.30]
    - [1.0, 0.55]
    - [3.0, 0.40]
    - [8.0, 0.30]
  reentry_ballistic_coeff_kg_m2: 5000  # Higher beta = less deceleration
  nose_radius_m: 0.10  # Larger radius = lower stagnation heating

limits:
  max_g_load: 40
  max_stagnation_heat_flux_w_cm2: 1500

environment:
  atmosphere: us_standard_1976
  earth_model: spherical_rotating

sweep:
  launch_angle_step_deg: 1
  burn_param_step: 0.05
